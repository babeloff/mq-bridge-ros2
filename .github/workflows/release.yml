name: Release packages

on:
  push:
    tags:
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version tag to package, for example 0.4.19"
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
  # The packaging CLI is released separately from mq-bridge and currently
  # lags the core/plugin version. Keep this independent from RELEASE_TAG.
  MQ_BRIDGE_PACKAGER_VERSION: "0.4.16"
  CARGO_TERM_COLOR: always
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "5"
  # Every binary artifact is specific to one ROS distribution, because the `rcl`
  # ABI differs between them. Releasing for a second distribution means running
  # this workflow again with a different value here, not adding a matrix axis:
  # a Python wheel's platform tag has no room to say which ROS it was built for.
  ROS_DISTRO_TARGET: jazzy
  # The pixi environment that provides that distribution. Keep in step with
  # `[environments]` in pixi.toml: jazzy is `default`, humble is `humble`.
  PIXI_ENVIRONMENT: default

jobs:
  verify-version:
    name: Verify release version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Match package versions to tag
        run: |
          python scripts/set_version.py --check
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          expected = os.environ["RELEASE_TAG"].removeprefix("v")
          actual = tomllib.loads(Path("Cargo.toml").read_text())["package"]["version"]
          if actual != expected:
              raise SystemExit(
                  f"tag version {expected!r} does not match Cargo.toml {actual!r}"
              )
          print(f"releasing {expected}")
          PY

  build-native-packages:
    name: Build npm and Python (${{ matrix.platform }})
    needs: verify-version
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      # mq-bridge's packaging tools look for the compiled library at
      # `<root>/target/release/` literally, honouring neither `CARGO_TARGET_DIR`
      # nor a `build.target-dir` from a cargo configuration file. A runner has
      # no such configuration today, so this is belt and braces — but if one
      # ever gained it, cargo would succeed and the staging step would report
      # "cargo produced no shared plugin library".
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux-x64-gnu
            triple: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            platform: linux-arm64-gnu
            triple: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            platform: darwin-x64
            triple: x86_64-apple-darwin
          - runner: macos-latest
            platform: darwin-arm64
            triple: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # ROS, the Rust toolchain and python all come from the locked pixi
      # environment. Installing from pixi.lock rather than re-solving here is
      # what keeps a release off the failure that broke CI: a fresh solve
      # validates each download against the size in the channel's repodata, and
      # that metadata is not always right, whereas the lock records a sha256.
      #
      # `activate-environment` exports the environment into the job, so the
      # steps below run with ROS on the loader path and need no `pixi run`
      # prefix and no login shell.
      - name: Install ROS 2 ${{ env.ROS_DISTRO_TARGET }} from pixi.lock
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: ${{ env.PIXI_ENVIRONMENT }}
          locked: true
          cache: true
          activate-environment: true

      - name: Install mq-bridge packagers
        shell: bash
        working-directory: node
        run: |
          npm install --no-package-lock
          python -m pip install \
            "mq-bridge-py[plugin-packaging]==${MQ_BRIDGE_PACKAGER_VERSION}" \
            build

      - name: Stage npm native library
        shell: bash
        working-directory: node
        run: npx mq-bridge-package-plugin --root .. --package node

      - name: Build Python wheel
        shell: bash
        run: python -m mq_bridge.plugin_packaging --package python/mq_bridge_ros2 --out python/dist

      - name: Retag macOS wheel
        if: runner.os == 'macOS'
        shell: bash
        env:
          WHEEL_PLATFORM_TAG: ${{ matrix.platform == 'darwin-arm64' && 'macosx_11_0_arm64' || 'macosx_10_9_x86_64' }}
        run: |
          # The packager tags every macOS wheel universal2, so both macOS builds
          # would emit the same filename for a single-architecture library.
          python -m pip install "wheel>=0.45"
          python -m wheel tags --platform-tag "$WHEEL_PLATFORM_TAG" --remove python/dist/*.whl

      - name: Repair Linux wheel
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m pip install auditwheel patchelf
          patchelf --version
          python -m auditwheel repair python/dist/*.whl --wheel-dir python/repaired
          rm python/dist/*.whl
          mv python/repaired/*.whl python/dist/

      - name: Build standalone plugin archive
        shell: bash
        env:
          PLUGIN_TRIPLE: ${{ matrix.triple }}
          PLUGIN_VERSION: ${{ env.RELEASE_TAG }}
          ROS_DISTRO_TARGET: ${{ env.ROS_DISTRO_TARGET }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          import shutil
          from pathlib import Path

          triple = os.environ["PLUGIN_TRIPLE"]
          version = os.environ["PLUGIN_VERSION"].removeprefix("v")
          libraries = [
              path
              for path in Path("node/prebuilds").rglob("*")
              if path.suffix in {".so", ".dylib", ".dll"}
          ]
          if len(libraries) != 1:
              raise SystemExit(f"expected one staged plugin library, found {libraries}")

          staging = Path("release-dist/staging")
          staging.mkdir(parents=True)
          shutil.copy2(libraries[0], staging / libraries[0].name)
          shutil.copy2("node/mq-bridge-plugin.json", staging / "mq-bridge-plugin.json")
          shutil.copy2("LICENSE", staging / "LICENSE")

          # The ROS distribution is part of the identity of the artifact: the
          # `rcl` ABI differs between distributions, so a `jazzy` build is not
          # usable on `humble` even on the same platform.
          distro = os.environ["ROS_DISTRO_TARGET"]
          # One archive shape on every platform — name, version, Rust target
          # triple — and a checksum beside it. The Homebrew formula and the
          # conda recipe are generated from these, and the sidecar is what
          # spares the renderer from downloading every archive to hash it.
          base = Path("release-dist") / f"mq-bridge-ros2-{version}-{triple}"
          archive = Path(shutil.make_archive(str(base), "gztar", staging))
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          archive.with_name(archive.name + ".sha256").write_text(
                 f"{digest}  {archive.name}\n"
          )
          PY

      - name: Upload standalone plugin archive
        uses: actions/upload-artifact@v7
        with:
          name: standalone-${{ matrix.platform }}
          path: release-dist/mq-bridge-ros2-*
          if-no-files-found: error

      - name: Upload npm native library
        uses: actions/upload-artifact@v7
        with:
          name: npm-${{ matrix.platform }}
          path: node/prebuilds
          if-no-files-found: error

      - name: Upload Python wheel
        uses: actions/upload-artifact@v7
        with:
          name: python-${{ matrix.platform }}
          path: python/dist/*.whl
          if-no-files-found: error

  publish-crate:
    name: Publish crate
    needs: build-native-packages
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # `cargo package` builds to verify the archive, and that build needs ROS.
      # Both it and the Rust toolchain come from the locked pixi environment.
      - name: Install ROS 2 ${{ env.ROS_DISTRO_TARGET }} from pixi.lock
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: ${{ env.PIXI_ENVIRONMENT }}
          locked: true
          cache: true
          activate-environment: true

      - name: Verify crate package
        shell: bash
        run: cargo package

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18

      - name: Publish crate
        shell: bash
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Upload crate archive
        uses: actions/upload-artifact@v7
        with:
          name: crate-package
          path: target/package/*.crate
          if-no-files-found: error

  publish-npm:
    name: Publish npm package
    needs: build-native-packages
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.5.1

      - name: Download native libraries
        uses: actions/download-artifact@v8
        with:
          pattern: npm-*
          path: node/prebuilds
          merge-multiple: true

      - name: Create npm tarball
        working-directory: node
        run: mkdir -p ../dist && npm pack --pack-destination ../dist

      - name: Publish to npm
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: npm publish ./dist/*.tgz --access public

      - name: Upload npm tarball
        uses: actions/upload-artifact@v7
        with:
          name: npm-tarball
          path: dist/*.tgz
          if-no-files-found: error

  publish-pypi:
    name: Publish Python wheels
    needs: build-native-packages
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          pattern: python-*
          path: dist
          merge-multiple: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Validate wheels
        run: |
          python -m pip install twine
          ls -1 dist/
          twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  github-release:
    name: Create GitHub release
    needs: [build-native-packages, conda]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install ROS 2 ${{ env.ROS_DISTRO_TARGET }} from pixi.lock
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: ${{ env.PIXI_ENVIRONMENT }}
          locked: true
          cache: true
          activate-environment: true

      - name: Download standalone plugin archives
        uses: actions/download-artifact@v8
        with:
          pattern: standalone-*
          path: artifacts/plugins
          merge-multiple: true

      - name: Create npm tarball
        shell: bash
        run: |
          mkdir -p artifacts/npm
          npm pack --pack-destination artifacts/npm ./node

      - name: Download Python wheels
        uses: actions/download-artifact@v8
        with:
          pattern: python-*
          path: artifacts/python
          merge-multiple: true

      - name: Download crate archive
        shell: bash
        run: cargo package --no-verify --allow-dirty

      - name: Collect crate archive
        shell: bash
        run: |
          mkdir -p artifacts/crate
          cp target/package/*.crate artifacts/crate/

      - name: Download conda packages
        uses: actions/download-artifact@v8
        with:
          pattern: conda-*
          path: artifacts/conda
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          name: mq-bridge-ros2 ${{ env.RELEASE_TAG }}
          tag_name: ${{ env.RELEASE_TAG }}
          files: artifacts/**/*

  # Render the formula from the checksums attached to the GitHub release, then
  # copy it into the tap used by Homebrew consumers.
  update-homebrew-tap:
    name: Update Homebrew tap
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Render formula from release assets
        run: packaging/homebrew/render.sh "${RELEASE_TAG}" "${{ github.repository }}" out

      - name: Push to tap
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_KEY}" ]; then
            echo "::error::HOMEBREW_TAP_DEPLOY_KEY is not configured; the tap was not updated"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${DEPLOY_KEY}" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes"
          git clone git@github.com:babeloff/homebrew-tap.git tap
          mkdir -p tap/Formula
          cp out/Formula/mq-bridge-ros2.rb tap/Formula/mq-bridge-ros2.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/mq-bridge-ros2.rb
          if git diff --cached --quiet; then
            echo "tap already up to date for ${RELEASE_TAG}"
            exit 0
          fi
          git commit -m "mq-bridge-ros2 ${RELEASE_TAG}"
          git push

  conda:
    name: Conda ${{ matrix.target }} package
    needs: build-native-packages
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      RELEASE_TARGET_PLATFORM: ${{ matrix.build_target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-64
            build_target: linux_64
            runner: ubuntu-22.04
            artifact: standalone-linux-x64-gnu
          - target: linux-aarch64
            build_target: linux_aarch64
            runner: ubuntu-24.04-arm
            artifact: standalone-linux-arm64-gnu
          - target: osx-64
            build_target: osx_64
            runner: macos-15-intel
            artifact: standalone-darwin-x64
          - target: osx-arm64
            build_target: osx_arm64
            runner: macos-latest
            artifact: standalone-darwin-arm64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the standalone plugin archive
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: release-dist

      - name: Stage the library for the recipe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packaging/conda/stage
          tar xzf release-dist/mq-bridge-ros2-*.tar.gz -C packaging/conda/stage
          echo "MQ_BRIDGE_PLUGIN_VERSION=${RELEASE_TAG#v}" >> "${GITHUB_ENV}"
          echo "ROS_DISTRO_TARGET=${ROS_DISTRO_TARGET}" >> "${GITHUB_ENV}"

      # The recipe repackages the tested standalone library. It does not build
      # Rust again, so the conda package and the GitHub release contain the
      # same plugin binary.
      - name: Build the conda package
        uses: prefix-dev/rattler-build-action@1ca5f45832f419a46d1326ccc5861d7e14d67c44 # v0.2.39
        with:
          recipe-path: packaging/conda/release-recipe.yaml
          build-args: --target-platform=${{ matrix.target }} -c conda-forge
          artifact-name: conda-${{ matrix.target }}

  publish-conda:
    name: Publish conda packages
    needs: conda
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download conda packages
        uses: actions/download-artifact@v8
        with:
          pattern: conda-*
          path: conda-packages
          merge-multiple: true

      - name: Upload to Anaconda.org
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ANACONDA_API_TOKEN}" ]; then
            echo "::error::ANACONDA_API_TOKEN is not configured; no conda package was published"
            exit 1
          fi
          mapfile -t packages < <(find conda-packages -type f -name '*.conda' | sort)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "::error::no conda packages were produced"
            exit 1
          fi
          pipx install --include-deps anaconda-client
          anaconda upload --user babeloff --label main "${packages[@]}"
