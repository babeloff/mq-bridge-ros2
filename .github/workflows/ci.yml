name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  # `rclrs` links `rcl` and loads message type support libraries from a ROS
  # installation, so there is no build without one — not even for the unit
  # tests, whose binary would fail to load.
  #
  # The environment comes from pixi, using pixi.lock, rather than a fresh solve
  # here. That is deliberate on two counts:
  #
  #   * The dependency list lives in pixi.toml only. A copy in this file would
  #     be a second thing to keep in step.
  #
  #   * A fresh solve validates each download against the size recorded in the
  #     channel's repodata, and that metadata is not always right: robostack-jazzy
  #     briefly advertised sizes a few bytes off from the files it served, which
  #     failed the install for eight packages whose bytes were in fact correct.
  #     A locked install checks the sha256 recorded in pixi.lock, which is a
  #     statement about content rather than about metadata.
  #
  # There is no broker to start: ROS 2 is peer to peer, so the end-to-end tests
  # discover themselves over loopback on a dedicated domain.
  ros2-tests:
    name: Tests (ROS 2 ${{ matrix.ros_distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One pixi environment per distribution, because the `rcl` ABI differs
        # between them. Keep this in step with `[environments]` in pixi.toml and
        # the `ros_distro` list in recipes/variants.yaml.
        include:
          - ros_distro: jazzy
            environment: default
          - ros_distro: humble
            environment: humble
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify package versions
        run: python3 scripts/set_version.py --check

      # No separate Rust toolchain step: `rust` is a locked pixi dependency, so
      # the compiler comes from the same environment as ROS.
      - name: Install ROS 2 ${{ matrix.ros_distro }} from pixi.lock
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: ${{ matrix.environment }}
          # Install exactly what is locked, and fail if pixi.lock has drifted
          # from pixi.toml rather than quietly re-solving.
          locked: true
          cache: true

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.ros_distro }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-${{ matrix.ros_distro }}-cargo-

      # The task scripts add the environment's lib directory to the loader path
      # and give each distribution its own cargo target directory, so nothing
      # has to be exported here.
      - name: Unit tests
        run: pixi run -e ${{ matrix.environment }} test --unit

      - name: ROS 2 integration tests
        run: pixi run -e ${{ matrix.environment }} test --integration

      - name: Endpoint conformance, linked and plugin-loaded
        run: pixi run -e ${{ matrix.environment }} test --conformance

  # Type-checks the crate without a ROS installation. This is what the
  # `ros-shim` feature is for, and it keeps the compile clean for contributors
  # who have no ROS on their machine.
  shim-check:
    name: Check without a ROS installation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Check with the ROS shim
        env:
          RUSTFLAGS: --cfg ros_distro="jazzy"
        run: cargo check --features ros-shim --all-targets

  # No ROS needed: this only reads the AsciiDoc sources. It catches a broken
  # cross-reference between pages, which asciidoctor itself does not check and
  # which otherwise ships as a dead link.
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install asciidoctor
        run: gem install asciidoctor --no-document

      - name: Validate the documentation
        run: python3 pixi-scripts/docs.py --check

  node-package:
    name: Node package smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: node
        run: npm install --no-package-lock

      - name: Run tests
        working-directory: node
        run: npm test
