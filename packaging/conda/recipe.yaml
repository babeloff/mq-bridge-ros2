schema_version: 1

context:
  version: ${{ env.get("MQ_BRIDGE_PLUGIN_VERSION") }}

package:
  name: mq-bridge-pulsar
  version: ${{ version }}

# Nothing is compiled here. `stage/` holds the prebuilt archive the release
# publishes, so the conda package ships the same library as the wheel, the npm
# package and the Homebrew formula rather than a separately built copy.
source:
  path: stage
  # CI stages exactly what belongs in the package; gitignore rules must not
  # quietly drop a library on the way in.
  use_gitignore: false

build:
  number: 0
  # mq-bridge probes `<prefix>/lib/mq-bridge` on Unix and `Library\bin` on
  # Windows, where a conda environment keeps its DLLs. Installing there is the
  # whole installation: a route can name the `pulsar` endpoint with no config.
  script:
    content:
      - if: win
        then:
          - if not exist "%LIBRARY_BIN%" mkdir "%LIBRARY_BIN%"
          - copy /Y mq_bridge_pulsar.dll "%LIBRARY_BIN%"
        else:
          - mkdir -p "${PREFIX}/lib/mq-bridge"
          - cp libmq_bridge_pulsar.* "${PREFIX}/lib/mq-bridge/"

tests:
  - package_contents:
      files:
        - if: win
          then: Library/bin/mq_bridge_pulsar.dll
          else: lib/mq-bridge/libmq_bridge_pulsar.*

about:
  homepage: https://github.com/marcomq/mq-bridge-pulsar
  repository: https://github.com/marcomq/mq-bridge-pulsar
  documentation: https://marcomq.github.io/mq-bridge/
  summary: Apache Pulsar endpoint plugin for mq-bridge
  description: |
    A loadable endpoint plugin that lets mq-bridge read from and write to
    Apache Pulsar. It is a shared library, not a program: install it into the
    same environment as mq-bridge-app, or any environment whose mq-bridge host
    searches this prefix, and routes can then use the `pulsar` endpoint.
  license: MIT

extra:
  recipe-maintainers:
    - marcomq
