[package]
name = "mq-bridge-myendpoint"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Myendpoint endpoint extension for mq-bridge"
repository = "https://github.com/your-github-user/mq-bridge-myendpoint"
include = [
    "/src/**",
    "/tests/**",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[lib]
# `rlib` for Rust users who link the endpoint directly; `cdylib` is the loadable
# plugin the Python and npm packages ship and `load_endpoint_plugin` opens.
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
mq-bridge = { version = "0.4.18", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# Derives the configuration schema from the config struct, so the two cannot drift.
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
mq-bridge = { version = "0.4.18", default-features = false, features = ["plugin-sdk", "test-utils"] }
tokio = { version = "1.34", features = ["rt-multi-thread", "macros"] }

[features]
# The plugin export is on by default: it is what the Python and npm packages
# load. Turn it off (`default-features = false`) when linking this crate
# directly alongside another plugin, since both would define the same
# `mq_bridge_plugin_v1` symbol.
default = ["plugin"]
plugin = ["mq-bridge/plugin-sdk"]
