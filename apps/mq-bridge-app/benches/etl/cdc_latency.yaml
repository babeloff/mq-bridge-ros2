# Scenario 2 — CDC end-to-end latency, zero-code config path.
#
# A single consumer route: postgres_cdc (logical replication) -> file. The runner
# (run_cdc_latency.sh) starts it with POST /consumer-start, commits rows at a fixed
# rate and tails the sink file; cdc_latency.py turns that into commit-to-sink
# latency percentiles.
#
# No `metrics` middleware: on an input endpoint its duration is the wait for the
# next event, i.e. the inter-arrival time, not a latency.
log_level: info
ui_addr: 127.0.0.1:9091
consumers:
  - name: cdc_lat
    endpoint:
      postgres_cdc:
        url: postgres://testuser:testpass@localhost:5432/testdb
        publication: mqb_pub
        slot_name: mqb_slot
        create_slot: true
        # Permanent slot: a temporary slot is dropped when its creating connection
        # closes, which races the streaming connection ("slot does not exist").
        # The runner drops the slot before each run so it starts clean.
        temporary_slot: false
        status_interval_ms: 1000
    output:
      mode: publisher
      publisher: cdc_out
    message_capture:
      enabled: false
    concurrency: 1
    batch_size: 1
publishers:
  - name: cdc_out
    endpoint:
      file:
        path: /tmp/mqb_cdc_out.jsonl
        format: raw
