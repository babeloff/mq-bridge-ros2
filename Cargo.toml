[package]
name = "mq-bridge-ros2"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "ROS 2 endpoint extension for mq-bridge"
repository = "https://github.com/phreed/mq-bridge-ros2"
include = ["/src/**", "/tests/**", "/examples/**", "/Cargo.toml", "/README.md"]

[lib]
# `rlib` for Rust users who link the endpoint directly; `cdylib` is the loadable
# plugin the Python and npm packages ship and `load_endpoint_plugin` opens.
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
mq-bridge = { version = "0.4.5", default-features = false }
rclrs = "0.7"
rosidl_runtime_rs = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.34", features = ["rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
mq-bridge = { version = "0.4.5", default-features = false, features = ["plugin-sdk", "test-utils"] }
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4"] }

[[example]]
name = "ros2_to_file"
required-features = ["example-app"]

[features]
# The plugin export is on by default: it is what the Python and npm packages
# load. Turn it off (`default-features = false`) when linking this crate
# directly alongside another plugin, since both would define the same
# `mq_bridge_plugin_v1` symbol.
default = ["plugin"]
plugin = ["mq-bridge/plugin-sdk"]
example-app = []
# Build without a sourced ROS 2 installation: `rclrs` then resolves every ROS
# symbol by `dlopen` at run time instead of linking at build time. The ROS
# distribution still has to be chosen at compile time, because the `rcl` ABI
# differs between distributions, so a shim build additionally requires
# `RUSTFLAGS='--cfg ros_distro="jazzy"'`. This is how the published plugin
# artifacts are built; see README.md.
ros-shim = ["rclrs/use_ros_shim"]
