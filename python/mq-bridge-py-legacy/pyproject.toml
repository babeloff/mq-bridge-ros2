# Final `mq-bridge-py` release: an empty package that installs `mq-bridge`,
# so existing `pip install mq-bridge-py` pins keep working. Publish once by hand.
[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mq-bridge-py"
version = "0.4.16"
description = "Renamed to mq-bridge. Install `mq-bridge` instead; this package only depends on it."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["mq-bridge>=0.4.16"]
license = { text = "MIT OR Apache-2.0" }
classifiers = [
  "Development Status :: 7 - Inactive",
  "License :: OSI Approved :: MIT License",
  "License :: OSI Approved :: Apache Software License",
]

[project.urls]
Homepage = "https://pypi.org/project/mq-bridge/"
Repository = "https://github.com/marcomq/mq-bridge"

[tool.hatch.build.targets.wheel]
bypass-selection = true
