[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mq-bridge-ros2"
version = "0.1.0"
description = "ROS 2 endpoint for mq-bridge"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
keywords = ["messaging", "ros2", "ros", "dds", "mq-bridge", "etl"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: System :: Networking",
]
# Deliberately no dependency on mq-bridge: the two are installed and upgraded
# independently, and `register()` reports a clear error if mq-bridge is absent.
# The ROS 2 installation is not a Python dependency either — it has to be
# sourced in the environment, which pip cannot do.
dependencies = []

[project.urls]
Repository = "https://github.com/phreed/mq-bridge-ros2"

[tool.setuptools]
# The wheel carries a prebuilt library, so it is platform-specific; see
# mq_bridge.plugin_packaging stages the library and applies the platform tag.
packages = ["mq_bridge_ros2"]

[tool.setuptools.package-data]
mq_bridge_ros2 = ["*.so", "*.dylib", "*.dll", "mq-bridge-plugin.json"]
